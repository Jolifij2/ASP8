@{
    ViewData["Title"] = "Товары";
}

<h1>Управление товарами</h1>

<!-- Токен для защиты от CSRF -->
@Html.AntiForgeryToken()

<div style="display: flex; gap: 30px;">
    <div style="flex: 1;">
        <h3>Добавить товар</h3>
        <div><label>Название:</label><input type="text" id="productName" /></div>
        <div><label>Цена:</label><input type="number" id="productPrice" step="0.01" /></div>
        <div><label>Категория:</label><input type="text" id="productCategory" /></div>
        <hr />
        <button id="btnAdd">Добавить (AJAX)</button>

        <h3>Редактировать товар</h3>
        <div><label>ID:</label><input type="number" id="editId" readonly /></div>
        <div><label>Название:</label><input type="text" id="editName" /></div>
        <div><label>Цена:</label><input type="number" id="editPrice" step="0.01" /></div>
        <div><label>Категория:</label><input type="text" id="editCategory" /></div>
        <button id="btnUpdate">Сохранить (AJAX)</button>
    </div>

    <div style="flex: 2;">
        <h3>Список товаров</h3>
        <div>Всего товаров: <span id="productCount">0</span></div>
        <input type="text" id="searchQuery" placeholder="Поиск по названию..." />
        <button id="btnRefresh">Обновить список (AJAX)</button>
        <div id="productsList"></div>
    </div>
</div>

<div id="message" style="margin-top: 20px; padding: 10px; display: none;"></div>

<div id="xssTest" style="margin-top: 20px;">
    <button id="btnXss">Проверить XSS (опасный)</button>
    <button id="btnSafeXss">Проверить XSS (безопасный)</button>
    <div id="xssOutput"></div>
</div>

@section Scripts {
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        // Получить токен для защиты
        function getToken() {
            return $('input[name="_RequestVerificationToken"]').val();
        }

        // Показать сообщение
        function showMessage(text, isSuccess) {
            $('#message').text(text)
                .css('background', isSuccess ? '#d4edda' : '#f8d7da')
                .css('color', isSuccess ? '#155724' : '#721c24')
                .css('padding', '10px')
                .css('border-radius', '5px')
                .show();
            setTimeout(() => $('#message').hide(), 3000);
        }

        // Загрузить все товары
        function loadProducts() {
            $.ajax({
                url: '/Products/GetAll',
                type: 'GET',
                success: function (data) {
                    renderProducts(data);
                    $('#productCount').text(data.length);
                },
                error: function () {
                    showMessage('Ошибка загрузки', false);
                }
            });
        }

        // Отрисовка таблицы товаров
        function renderProducts(data) {
            let html = '<table border="1" cellpadding="10"><thead><tr>';
            html += '<th>ID</th><th>Название</th><th>Цена</th><th>Категория</th><th>Действия</th></tr></thead><tbody>';
            data.forEach(function (p) {
                html += '<tr>';
                html += '<td>' + p.id + '</td>';
                html += '<td>' + p.name + '</td>';
                html += '<td>' + p.price.toFixed(2) + '</td>';
                html += '<td>' + p.category + '</td>';
                html += '<td>';
                html += '<button onclick="editProduct(' + p.id + ')">Редактировать</button> ';
                html += '<button onclick="deleteProduct(' + p.id + ')">Удалить</button>';
                html += '</td>';
                html += '</tr>';
            });
            html += '</tbody></table>';
            $('#productsList').html(html);
            $('#productCount').text(data.length);
        }

        // Добавить товар
        function addProduct() {
            const product = {
                name: $('#productName').val(),
                price: parseFloat($('#productPrice').val()) || 0,
                category: $('#productCategory').val()
            };
            $.ajax({
                url: '/Products/Add',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(product),
                headers: { 'RequestVerificationToken': getToken() },
                success: function (response) {
                    showMessage(response.message, true);
                    loadProducts();
                    $('#productName').val('');
                    $('#productPrice').val('');
                    $('#productCategory').val('');
                },
                error: function (xhr) {
                    const error = xhr.responseJSON;
                    showMessage(error ? error.message : 'Ошибка', false);
                }
            });
        }

        // Удалить товар
        function deleteProduct(id) {
            if (!confirm('Удалить товар?')) return;
            $.ajax({
                url: '/Products/Delete?id=' + id,
                type: 'POST',
                headers: { 'RequestVerificationToken': getToken() },
                success: function (response) {
                    showMessage(response.message, true);
                    loadProducts();
                },
                error: function () {
                    showMessage('Ошибка удаления', false);
                }
            });
        }

        // Редактировать товар (заполнение формы)
        function editProduct(id) {
            $.ajax({
                url: '/Products/GetById?id=' + id,
                type: 'GET',
                success: function (p) {
                    $('#editId').val(p.id);
                    $('#editName').val(p.name);
                    $('#editPrice').val(p.price);
                    $('#editCategory').val(p.category);
                },
                error: function () {
                    showMessage('Ошибка загрузки товара', false);
                }
            });
        }

        // Обновить товар
        function updateProduct() {
            const product = {
                id: parseInt($('#editId').val()),
                name: $('#editName').val(),
                price: parseFloat($('#editPrice').val()) || 0,
                category: $('#editCategory').val()
            };
            $.ajax({
                url: '/Products/Update',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(product),
                headers: { 'RequestVerificationToken': getToken() },
                success: function (response) {
                    showMessage(response.message, true);
                    loadProducts();
                },
                error: function (xhr) {
                    const error = xhr.responseJSON;
                    showMessage(error ? error.message : 'Ошибка обновления', false);
                }
            });
        }

        // Поиск (Задание 1)
        function searchProducts() {
            const query = $('#searchQuery').val();
            $.ajax({
                url: '/Products/Search?query=' + encodeURIComponent(query),
                type: 'GET',
                success: function (data) {
                    renderProducts(data);
                },
                error: function () {
                    showMessage('Ошибка поиска', false);
                }
            });
        }

        // XSS-тест (опасный)
        function testXss() {
            $.ajax({
                url: '/Products/GetHtml',
                type: 'GET',
                success: function (data) {
                    $('#xssOutput').html(data); // Опасно: скрипт выполнится
                }
            });
        }

        // XSS-тест (безопасный)
        function testSafeXss() {
            $.ajax({
                url: '/Products/GetSafeHtml',
                type: 'GET',
                success: function (data) {
                    $('#xssOutput').text(data.html); // Безопасно: текст, а не HTML
                }
            });
        }

        $(document).ready(function () {
            loadProducts();
            $('#btnAdd').click(addProduct);
            $('#btnRefresh').click(loadProducts);
            $('#btnUpdate').click(updateProduct);
            $('#searchQuery').on('keyup', searchProducts);
            $('#btnXss').click(testXss);
            $('#btnSafeXss').click(testSafeXss);
        });
    </script>
}
